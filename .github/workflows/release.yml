# Builds installers for macOS, Windows and Linux, and attaches them to a
# GitHub Release.
#
# Triggered by pushing a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
#
# Each platform must be built on its own runner — a Windows .exe cannot
# reliably be produced from macOS, which is the whole reason this file
# exists rather than building locally.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # lets you trigger a test build from the Actions tab

permissions:
  contents: write # required to attach files to the Release

jobs:
  build:
    strategy:
      fail-fast: false # one platform failing shouldn't discard the others
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins — the point
      # of a reproducible build. Never `npm install` in CI.
      - run: npm ci

      # Runs typecheck + electron-vite build + electron-builder.
      # better-sqlite3 needs no rebuild step: it's a Node-API addon and
      # ships prebuilt binaries for every platform in this matrix.
      - run: npm run ${{ matrix.script }}

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true # review before publishing; flip to false when confident
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.zip
